# docker compose up -d            -> CPU
# docker compose --profile gpu up -d kontho-gpu   -> NVIDIA GPU (needs nvidia-container-toolkit)
services:
  kontho:
    build: .
    image: kontho:latest
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - kontho-data:/data
      - kontho-models:/models
    restart: unless-stopped

  kontho-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        BASE_IMAGE: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
        TORCH: preinstalled
    image: kontho:gpu
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      KONTHO_DEVICE: cuda
    volumes:
      - kontho-data:/data
      - kontho-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  kontho-data:
  kontho-models:
